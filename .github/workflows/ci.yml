name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一 ref 上连续补推时取消上一轮
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-24.04
    services:
      # 与 docker-compose 同镜像：任务队列、会话、检索等用例需要真 PG + pgvector
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: moqian
          POSTGRES_PASSWORD: moqian
          POSTGRES_DB: moqian
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U moqian -d moqian"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://moqian:moqian@127.0.0.1:5433/moqian
      APP_ENV: ci
      # 测试不调真模型；CI 里只需配置合法形状
      LLM_BASE_URL: https://llm.invalid
      LLM_MODEL: test-model
      LLM_API_KEY: sk-ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 建表（有序 SQL 迁移）
        run: python -m app.migrate
      - name: ruff
        run: ruff check .
      - name: pytest（离线用例 + 数据库用例）
        run: pytest
