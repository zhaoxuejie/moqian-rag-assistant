        questions:
          type: integer
        resolveRate:
          type: number
        lastActive:
          type: string
          nullable: true
        state:
          type: string
          enum: [active, idle, inactive]

    EngineerStatPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EngineerStat"
        pagination:
          $ref: "#/components/schemas/Pagination"

    RecognizabilityStats:
      type: object
      required: [week, recognizableRate, threshold, totalSessions, identifiableSessions]
