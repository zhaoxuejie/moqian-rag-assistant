      type: object
      required: [week, kpi, sessionResolveRate, recognizableRate]
      properties:
        week:
          type: string
        kpi:
          $ref: "#/components/schemas/Kpi"
        prevKpi:
          $ref: "#/components/schemas/Kpi"
        sessionResolveRate:
          type: number
          description: 会话级已解决率（含未识别）；与北极星同看
        recognizableRate:
          type: number
        badCases:
          type: integer
        weekly:
          type: array
