          type: string
          enum: [open, covered, ignored]
        coveredBy:
          type: string
        note:
          type: string

    GapPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
        pagination:
          $ref: "#/components/schemas/Pagination"
        stats:
          type: object
          properties:
            uncovered:
              type: integer
            covered:
              type: integer

    # ---------- admin：知识自测 ----------
    PreviewAskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
        model:
