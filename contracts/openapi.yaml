          type: string
        count:
          type: integer
          description: 被问到次数
        firstAt:
          type: string
          nullable: true
        lastAt:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, covered, ignored]
        coveredBy:
          type: string
          nullable: true
