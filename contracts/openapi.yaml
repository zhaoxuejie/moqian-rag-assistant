            - type: string
            - type: number
            - type: integer
        unit:
          type: string
          nullable: true
        delta:
          type: number
          nullable: true
          description: 与上周对比（可为负）
        source:
          type: string
          description: 数据来源接口，保证"与看板同源"可追溯

    WeeklyReportSection:
      type: object
      required: [title, metrics]
      properties:
        title:
          type: string
        body:
          type: string
          nullable: true
          description: 该节文字说明（结论与建议）
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyReportMetric"

    WeeklyReport:
      type: object
