                type: string
              count:
                type: integer
              model:
                type: string
        firstFixBuckets:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              count:
                type: integer

    NorthStar:
      type: object
      required: [week, north, resolveRate]
      properties:
        week:
          type: string
        north:
          type: object
          required: [asked, resolved]
          properties:
            asked:
              type: integer
