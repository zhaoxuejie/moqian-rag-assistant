          type: array
          description: 八节：概览 / 北极星 / 可识别率 / 拒答分析 / 知识缺口 / 沉淀 / 工程师 / 下周计划
          items:
            $ref: "#/components/schemas/WeeklyReportSection"
        exportedAt:
          type: string
          nullable: true
        format:
          type: string
          description: 导出格式（Markdown / PDF），[待确认]

    Badges:
