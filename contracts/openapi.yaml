        totalSessions:
          type: integer
        identifiableSessions:
          type: integer
        bySource:
          type: array
          items:
            type: object
            properties:
              source:
                $ref: "#/components/schemas/IdentitySource"
              sessions:
                type: integer
              label:
                type: string

    WeeklyReportMetric:
      type: object
      required: [label, value]
      properties:
