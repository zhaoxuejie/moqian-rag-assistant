          type: string
          enum: [local, remote]

    RerankerConfig:
      type: object
      required: [model]
      properties:
        baseUrl:
          type: string
          nullable: true
        model:
          type: string
        provider:
          type: string
          enum: [none, tencent, llama_cpp]
          description: |
            none=只用 RRF 融合；tencent=腾讯云 AI Search /v1/rerank；
            llama_cpp=本地 llama-server /v1/rerank（预留）。后台以「启用重排」开关控制，
            开启时保留既有非 none 值，关闭时写回 none；失败/超时自动回退 RRF。

    RetrievalConfig:
      type: object
      required: [topK, evidenceThreshold]
      properties:
        recallPerRoute:
          type: integer
          description: 单路召回条数（向量 / BM25 各一路）
        fusion:
          type: string
          description: 融合方式，默认 RRF
        topK:
          type: integer
          description: 最终进入生成的条数
        evidenceThreshold:
          type: number
          description: 证据门阈值（低于则拒答）

    WidgetSettings:
      type: object
      required: [welcome, samples, handoffText, brandColor]
      properties:
        welcome:
          type: string
        samples:
          type: array
          items:
            type: string
        handoffText:
          type: string
        brandColor:
          type: string

    SafetySettings:
      type: object
      required: [words]
      properties:
        words:
          type: array
          description: 安全规则词表（带电检修、短接安全回路、救援、撬门、盘车等）；命中即拦截
          items:
            type: string

    SecuritySettings:
      type: object
      required: [captchaEnabled]
      properties:
        captchaEnabled:
          type: boolean

    PreviewSettings:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 管理自测开关；开启后的会话 channel=admin_preview，不进指标

    BrandSettings:
      type: object
      required: [systemName, orgName, primaryColor]
      properties:
        systemName:
          type: string
        productName:
          type: string
        orgName:
          type: string
        primaryColor:
          type: string
        logo:
          type: string
          maxLength: 200000
          description: |
            内置标识（default）或自定义标识：SVG / PNG（≤100KB）的 data URL，
            由系统配置页在浏览器内校验后随品牌配置保存
        logoFileName:
          type: string

    DemoSettings:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            演示总开关。false = 暂停：即使带入口码也不建立会话、不产生回答，
            浮层提示「这个演示需要从官网入口进入」。
            只收窄不放大——`DEMO_ENABLED=false` 的部署（本机开发）不会被它打开。

    SystemConfig:
      type: object
      required: [llm, embedding, reranker, retrieval, widget, safety, security, preview, demo, brand]
      properties:
        llm:
          $ref: "#/components/schemas/LlmConfig"
        embedding:
          $ref: "#/components/schemas/EmbeddingConfig"
        reranker:
          $ref: "#/components/schemas/RerankerConfig"
        retrieval:
          $ref: "#/components/schemas/RetrievalConfig"
        widget:
          $ref: "#/components/schemas/WidgetSettings"
        safety:
          $ref: "#/components/schemas/SafetySettings"
        security:
          $ref: "#/components/schemas/SecuritySettings"
        preview:
          $ref: "#/components/schemas/PreviewSettings"
        demo:
          $ref: "#/components/schemas/DemoSettings"
        brand:
          $ref: "#/components/schemas/BrandSettings"

    SystemConfigPatch:
      type: object
      description: 只提交改动过的组；未出现的组保持原值
      properties:
        llm:
          $ref: "#/components/schemas/LlmConfig"
        embedding:
          $ref: "#/components/schemas/EmbeddingConfig"
        reranker:
          $ref: "#/components/schemas/RerankerConfig"
        retrieval:
          $ref: "#/components/schemas/RetrievalConfig"
        widget:
          $ref: "#/components/schemas/WidgetSettings"
        safety:
          $ref: "#/components/schemas/SafetySettings"
        security:
          $ref: "#/components/schemas/SecuritySettings"
        preview:
          $ref: "#/components/schemas/PreviewSettings"
        demo:
          $ref: "#/components/schemas/DemoSettings"
        brand:
          $ref: "#/components/schemas/BrandSettings"

    Theme:
      type: object
      required: [systemName, productName, orgName, primaryColor]
      properties:
        systemName:
          type: string
        productName:
          type: string
        orgName:
          type: string
        primaryColor:
          type: string
        logo:
          type: string
          maxLength: 200000
          description: 内置标识（default）或自定义 SVG / PNG（≤100KB）的 data URL
        logoFileName:
          type: string

    ThemePatch:
      type: object
      properties:
        systemName:
          type: string
        productName:
          type: string
        orgName:
          type: string
        primaryColor:
          type: string
        logo:
          type: string
          maxLength: 200000
          description: 内置标识（default）或自定义 SVG / PNG（≤100KB）的 data URL
        logoFileName:
          type: string

    LlmTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        model:
          type: string
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        firstTokenMs:
          type: integer
          nullable: true
          description: 首个流式事件到达时间（SSE 首事件实测 471ms，D2）
        error:
          type: string
          nullable: true
          description: 失败原因（鉴权/超时/模型不存在/返回空 content 等）

    EvalCase:
      type: object
      required: [id, question]
      properties:
        id:
          type: string
        question:
          type: string
        category:
          type: string
          nullable: true
          description: 故障类别（报警码 / 异响 / 温升 / 精度偏差）
        model:
          type: string
          nullable: true
        pairId:
          type: string
          nullable: true
          description: 跨型号/版本用例对 id
        pairLabel:
          type: string
          nullable: true
        hasBaseline:
          type: boolean
          description: 是否已有人工基线答案

    EvalMetrics:
      type: object
      properties:
        citationVerifiable:
          type: number
          description: 引用可核验率（[待确认] 判定细则 Q7）
        underRefusal:
          type: number
          description: 应答未答率（漏拒）
        overRefusal:
          type: number
          description: 不应答而拒率（过拒）
        keyPointHit:
          type: number
          description: 要点命中率
        batchConfusion:
          type: number
          description: 批次/版本混淆率（多版本坑）

    EvalBaseline:
      type: object
      description: 人工基线列（上线前实测）
      properties:
        note:
          type: string
        citationVerifiable:
          type: number
        keyPointHit:
          type: number
        avgMinutes:
          type: number

    EvalRun:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        startedAt:
          type: string
          nullable: true
        finishedAt:
          type: string
          nullable: true
        status:
          type: string
          enum: [running, done, failed]
        caseCount:
          type: integer
        modelSnapshot:
          type: string
          description: 本次运行用的模型快照（如 deepseek-flash · bge-m3 · bge-reranker-v2-m3）
        metrics:
          $ref: "#/components/schemas/EvalMetrics"
        baseline:
          $ref: "#/components/schemas/EvalBaseline"

    EvalRunDetail:
      allOf:
        - $ref: "#/components/schemas/EvalRun"
        - type: object
          properties:
            cases:
              type: array
              description: 逐例结果
              items:
                type: object
                properties:
                  caseId:
                    type: string
                  question:
                    type: string
                  answered:
                    type: boolean
                  refused:
                    type: boolean
                  refusalKind:
                    type: string
                    nullable: true
                    enum: [gap, safe, null]
                  citations:
                    type: integer
                  citationValid:
                    type: boolean
                    nullable: true
                  batchConfused:
                    type: boolean
                  keyPointHit:
                    type: boolean
                    nullable: true
                  elapsedMs:
                    type: integer

    EvalList:
      type: object
      required: [cases, runs]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/EvalCase"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/EvalRun"
        caseTotal:
          type: integer
        caseSource:
          type: string
          enum: [table, yaml]
          description: table=数据库 eval_cases；yaml=表为空，回落仓库 evals/cases.yaml
