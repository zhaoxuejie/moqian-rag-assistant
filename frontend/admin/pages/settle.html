<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识沉淀 · 售后知识助手管理台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<script src="../controllers/theme-boot.js?v=20261081"></script>
<link rel="stylesheet" href="/ui-design/tokens.css" />
<link rel="stylesheet" href="../styles/admin.css?v=20261081" />
</head>
<body data-page="settle">
<div class="layout">

  <!-- 侧边栏由 layout.js 注入（单点维护），页面只留挂载点 -->
  <aside class="side" id="appSide"></aside>

  <div class="main">
    <header class="topbar">
      <h1>知识沉淀</h1>
      <span class="topbar__sub">工单与对话产出的候选知识，经人工确认才转为知识</span>
      <div class="topbar__right">
        <span class="topbar__pill">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          本机环境 · 真实数据
        </span>
      </div>
    </header>

    <main class="content">
      <div class="stats">
        <div class="stat">
          <div class="stat__label"><svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>待确认</div>
          <div class="stat__num" data-stat="pending">—</div>
          <div class="stat__delta warn" data-stat="pendingNote">—</div>
        </div>
        <div class="stat">
          <div class="stat__label"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>已入库</div>
          <div class="stat__num" data-stat="approved">—</div>
          <div class="stat__delta" data-stat="approvedNote">—</div>
        </div>
        <div class="stat">
          <div class="stat__label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>已驳回</div>
          <div class="stat__num" data-stat="rejected">—</div>
          <div class="stat__delta" data-stat="rejectedNote">—</div>
        </div>
        <div class="stat">
          <div class="stat__label"><svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>两条通道</div>
          <div class="stat__num" data-stat="total">—</div>
          <div class="stat__delta" data-stat="channelNote">—</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="tabs" id="statusTabs">
          <button class="on" data-st="all">全部</button>
          <button data-st="pending">待确认</button>
          <button data-st="confirmed">已入库</button>
          <button data-st="rejected">已驳回</button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" placeholder="搜索候选标题 / 型号 / 工单号…" />
        </div>
        <span style="flex:1"></span>
        <span class="hint" style="margin:0">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          系统不会自动把模型产出发布为知识
        </span>
      </div>

      <div class="split">
        <div class="card">
          <div class="card__head">
            <h2>候选条目</h2>
            <span class="card__head spacer"></span>
            <span id="listNote" style="font-size:11.5px;color:#8a97a3">—</span>
          </div>
          <div class="chunklist" id="settleList"></div>
          <div class="empty" id="settleEmpty" hidden>
            <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
            没有匹配的候选条目，切换状态或清除筛选
          </div>
        </div>
        <div class="card" id="settleDetail"><!-- controllers/settle.js 渲染 --></div>
      </div>

      <div class="hint" style="margin-top:14px">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>候选只从两条通道进来：① 工程师在问答里点「收藏」的那轮回答；② 问答日志里对已解决工单点「一键沉淀」。
        两条通道都只产出「待确认」，必须人工确认才入库——系统不会自动把模型产出发布为知识。</span>
      </div>
    </main>
  </div>
</div>

<!-- 驳回：必须留理由，供主管与实施方复盘 -->
<div class="modal-mask" id="rejectModal" hidden>
  <div class="modal" style="width:480px">
    <div class="modal__head modal__head--danger">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
      驳回候选知识
    </div>
    <div class="modal__body">
      <div class="field">
        <label>驳回理由 <span style="color:#c0392b">*</span></label>
        <textarea id="rejectNote" rows="3" placeholder="例如：与手册 §6.4.3 冲突 / 结论不完整 / 含未验证推断"></textarea>
        <div class="sub">驳回后条目不入库，理由写入审核记录，便于复盘与新人培训。</div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn btn--ghost" data-close>取消</button>
      <button class="btn btn--danger" id="confirmReject">确认驳回</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="../adapters/real-api.js?v=20261081"></script>
<script src="../adapters/settle-api.js?v=20261081"></script>
<script src="../controllers/layout.js?v=20261081"></script>
<script src="../controllers/app.js?v=20261081"></script>
<script src="../controllers/settle.js?v=20261081"></script>
<script src="../controllers/preview.js?v=20261082"></script>
</body>
</html>
