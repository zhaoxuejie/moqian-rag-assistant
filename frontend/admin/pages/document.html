<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>切片预览 · 售后知识助手管理台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<script src="../controllers/theme-boot.js?v=20261081"></script>
<link rel="stylesheet" href="/ui-design/tokens.css" />
    <link rel="stylesheet" href="../styles/admin.css?v=20261081" />
</head>
<body data-page="document">
<div class="layout">

  <!-- 侧边栏由 layout.js 注入（单点维护），页面只留挂载点 -->
  <aside class="side" id="appSide"></aside>

  <!-- ===== 主区域 ===== -->
  <div class="main">
    <header class="topbar">
      <h1>切片预览与治理</h1>
      <span class="topbar__sub">核对切得对不对、元数据全不全；检索只用「启用」状态的证据单元</span>
      <div class="topbar__right">
        <span class="topbar__pill">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          本机环境 · 真实数据
        </span>
      </div>
    </header>

    <main class="content">
      <div class="crumbs">
        <a href="index.html">知识源管理</a>
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        <span id="docCrumb">—</span>
      </div>

      <!-- 版本提醒：仅当同型号存在其它版本时出现，文案由 app.js 依数据生成 -->
      <div class="versionbar" id="docVersionBar" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        <span id="docVersionText"></span>
      </div>

      <div class="card doc-banner">
        <div class="doc-banner__ic">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>
        </div>
        <div>
          <h2 id="docTitle">—</h2>
          <div style="font-size:12px;color:#52606d" id="docMeta">—</div>
          <div class="doc-banner__meta" id="docTags"></div>
        </div>
        <div class="doc-banner__ops">
          <button class="btn btn--ghost btn--sm" id="btnPreviewOriginal" title="打开原始文档">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            原文预览
          </button>
          <button class="btn btn--ghost btn--sm" id="btnEditMeta">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            编辑元数据
          </button>
          <button class="btn btn--ghost btn--sm" id="btnReparse">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            重新解析
          </button>
        </div>
      </div>

      <div class="split">
        <div class="card">
          <div class="card__head">
            <h2>证据单元</h2>
            <span class="card__head spacer"></span>
            <span id="chunkHeadNote" style="font-size:11.5px;color:#8a97a3">—</span>
          </div>
          <div class="chunklist" id="chunkList"></div>
          <div class="empty" id="chunkEmpty" hidden>
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            本知识源暂无示例切片
          </div>
        </div>

        <div class="card" id="chunkDetail"><!-- app.js 渲染 --></div>
      </div>
    </main>
  </div>
</div>

<!-- 文档级元数据补录（FR-K1：批次 / 版本 / 生效日期可上传后补录） -->
<div class="modal-mask" id="metaModal" hidden>
  <div class="modal" style="width:520px">
    <div class="modal__head">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      编辑文档元数据
    </div>
    <div class="modal__body">
      <div class="meta-grid">
        <div><label>适用设备型号</label><input id="eModel" /></div>
        <div><label>适用批次</label><input id="eBatch" /></div>
        <div><label>手册版本</label><input id="eVersion" /></div>
        <div><label>生效日期 / 生效期</label><input id="eEffective" /></div>
      </div>
      <div class="hint">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        这里改的是整份知识源的适用范围；单条证据的元数据在下方「检索元数据」中逐条修正。批次与版本是问答过滤的依据，填错会导致跨批次误召回。
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn btn--ghost" data-close>取消</button>
      <button class="btn btn--primary" id="saveMeta">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="previewModal" hidden>
  <div class="modal doc-preview" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal__head">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="previewTitle">原文预览</span>
      <span class="doc-preview__meta" id="previewMeta" style="margin-left:auto"></span>
    </div>
    <div class="doc-preview__body" id="previewBody"></div>
    <div class="modal__foot">
      <a class="btn btn--ghost btn--sm" id="previewDownload" href="#" download>下载原件</a>
      <button class="btn btn--ghost btn--sm" id="previewNewTab" type="button">新标签打开</button>
      <button class="btn btn--ghost btn--sm" id="previewFullscreen" type="button">全屏</button>
      <span style="margin-left:auto"></span>
      <button class="btn btn--ghost" id="previewClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="../adapters/real-api.js?v=20261081"></script>
<script src="../controllers/layout.js?v=20261081"></script>
<script src="../controllers/app.js?v=20261081"></script>
<script src="../controllers/preview.js?v=20261082"></script>
</body>
</html>
