<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的收藏 · 售后知识助手管理台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<script src="../controllers/theme-boot.js?v=20261081"></script>
<link rel="stylesheet" href="/ui-design/tokens.css" />
<link rel="stylesheet" href="../styles/admin.css?v=20261081" />
</head>
<body data-page="my-save">
<div class="layout">

  <!-- 侧边栏由 layout.js 注入（单点维护），页面只留挂载点 -->
  <aside class="side" id="appSide"></aside>

  <div class="main">
    <header class="topbar">
      <h1>我的收藏</h1>
      <span class="topbar__sub">个人域：收藏后能看见结果，知识回流才有正向反馈</span>
      <div class="topbar__right">
        <span class="topbar__pill">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          本机环境 · 真实数据
        </span>
      </div>
    </header>

    <main class="content">
      <div class="card">
        <div class="card__head">
          <h2>我的收藏</h2>
          <span class="card__head spacer"></span>
          <span style="font-size:11.5px;color:#8a97a3">收藏后能看见结果，知识回流才有正向反馈</span>
        </div>
        <div class="card__body" id="favBox"></div>
      </div>
      <div class="pager" id="favPager" hidden></div>

      <div class="hint" style="margin-top:14px">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        只展示你在助手面板里点过「收藏」的回答；收藏是个人视图，不替代知识沉淀的人工确认。
      </div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="../adapters/real-api.js?v=20261081"></script>
<script src="../adapters/users-api.js?v=20261081"></script>
<script src="../controllers/layout.js?v=20261081"></script>
<script src="../controllers/app.js?v=20261081"></script>
<script src="../controllers/preview.js?v=20261082"></script>
<script src="../controllers/my-save.js?v=20261081"></script>
</body>
</html>
