<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 售后知识助手管理台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<script src="../controllers/theme-boot.js?v=20261081"></script>
<link rel="stylesheet" href="/ui-design/tokens.css" />
    <link rel="stylesheet" href="../styles/admin.css?v=20261081" />
</head>
<body data-page="login">
<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-logo">
      <span class="login-logo__mark">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <b>售后知识助手 · 管理台</b>
    </div>
    <div class="login-sub">制造业设备售后知识库运营与评测平台</div>

    <div class="field">
      <label>账号（工号）</label>
      <input id="lgUser" type="text" placeholder="工号 / 账号" value="" autocomplete="username" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="lgPass" type="password" placeholder="平台密码" value="" autocomplete="current-password" />
    </div>
    <div class="field" id="lgCaptchaField" hidden>
      <label>验证码</label>
      <div style="display:flex;gap:10px;align-items:center">
        <input id="lgCaptcha" type="text" placeholder="输入右侧验证码" maxlength="8" autocomplete="off"
          style="flex:1;min-width:0" />
        <button type="button" id="lgCaptchaBtn" title="点击换一张"
          style="flex:none;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;height:44px;cursor:pointer;overflow:hidden">
          <img id="lgCaptchaImg" alt="验证码" style="height:42px;display:block" />
        </button>
      </div>
      <div class="sub" style="margin-top:4px">看不清可点击图片换一张；验证码 5 分钟内有效。</div>
    </div>
    <div class="login-err" id="lgErr"></div>
    <button class="btn btn--primary btn--block" type="submit">登 录</button>

    <div class="login-foot">使用平台账号登录；登录态保存在本机浏览器 localStorage，未登录无法进入内页。</div>
  </form>
</div>
<script src="../adapters/real-api.js?v=20261081"></script>
<script src="../controllers/app.js?v=20261081"></script>
</body>
</html>
