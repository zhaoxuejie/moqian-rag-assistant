    keywords: ["限速器", "校验"]

- id: ans-lubrication
  question: 导轨、门机链条多久润滑一次？
  expect:
    keywords: ["L-HL", "季度"]

- id: ans-fault-001
  question: HY-E001 是什么故障，应该怎么处理？
  context: { deviceModel: HY-G1000/1.6-JXW }
  expect:
    keywords: ["HY-E001", "门锁回路"]

