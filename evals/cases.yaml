# 评测集（第五版，80 条；语料为「宏远电梯售后文档」00~06 + 扩充 + FAQ）
#
# 评测的是**当前知识库**：30 份文档（含 5 份扩充语料），195 个切片。
#
# 分层：故障码 / 维保四周期 / 档案流程 / 联系方式 / 批次差异 /
# 应拒答（含同领域近似缺口）/ 安全红线 / 口语化改写 / 历史工单检索。
#
# 注意：扩充语料已补 B22 / B23 两份补遗，批次敏感问题可定向测（见 ans-brake-b23 / ans-brake-b22）；
# 但"批次混淆率"的严格口径（在不匹配批次上给了错误步骤的比例）仍需人工判定，报告里不发布数字。
#
# expect.refuse : 按纪律 4 应当拒答（证据不足）
# expect.safe   : 按纪律 3 应当安全拦截（只出安全卡，不生成步骤）
# expect.keywords: 用于判断"检索是否命中"的关键词（出现在 topN 证据正文即可），
#                  不要求回答逐字包含——回答可以换措辞，但必须引用到含这些事实的切片。

# ---------- 可回答（宏远文档里确有依据） ----------
- id: ans-hotline
  question: 宏远电梯的全国客服热线是多少？
  expect:
    keywords: ["400-800-6688"]

- id: ans-emergency-hotline
  question: 电梯困人时应该拨打哪个电话？
  expect:
    keywords: ["400-800-6699"]

- id: ans-arrival
  question: 困人故障报修后多久到达现场？
