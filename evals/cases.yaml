    keywords: ["30", "分钟"]

- id: ans-rescue-steps
  question: 困人救援的基本步骤是什么？
  expect:
    keywords: ["松闸盘车", "平层"]

- id: ans-maintain-cycle
  question: 电梯多久做一次维护保养？
  expect:
    keywords: ["半月", "季度", "年度"]

- id: ans-halfmonth-items
  question: 半月维保要检查哪些项目？
